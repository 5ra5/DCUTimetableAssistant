# runs Ollama in a container too - run with 'docker compose -f ollama.compose.yaml up -d'
include:
  - path: ./compose.yaml
services:
  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    env_file:
      - .env
  model-pull:
    container_name: model-pull
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama list | grep '$$MODEL' || ollama pull $$MODEL"]
    restart: "no"
    volumes:
      - ollama_models:/root/.ollama
    env_file:
      - .env

  app:
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
      model-pull:
        condition: service_completed_successfully

volumes:
  ollama_models: 