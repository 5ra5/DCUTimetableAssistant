# OPTIONAL add-on: run Ollama in a container too, instead of on the host.
#   docker compose -f compose.yaml -f ollama.compose.yaml up -d
# This is an override file merged on top of compose.yaml (do not use `include:` here, it cannot redefine `app`).
# The first run downloads the model (needs internet); later runs find it in the volume and skip the download.
services:
  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  model-pull:
    container_name: model-pull
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    entrypoint: ["/bin/sh", "-c"]
    command: ['ollama list | grep -qF "$$MODEL" || ollama pull "$$MODEL"']
    restart: "no"
    volumes:
      - ollama_models:/root/.ollama

  app:
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
      model-pull:
        condition: service_completed_successfully

volumes:
  ollama_models:
