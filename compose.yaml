# compose.yaml  (app only, Ollama on the host)
services:
  app:
    container_name: app
    build: .
    ports:
      - "8080:8080"
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      REFRESH_HOURS: ${REFRESH_HOURS:-8}
      DB_PATH: data/timetable.db
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    restart: unless-stopped